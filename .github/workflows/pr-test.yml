name: Test

on: 
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

concurrency:
  group: tests
  cancel-in-progress: true

jobs:
  build:
    container:
      image: swift:5.7.1-focal
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v2
    - name: Run Test
      run: | 
        swift package resolve
        swift test --enable-code-coverage
    - name: Code Coverage
      uses: mattpolzin/swift-codecov-action@0.7.1
